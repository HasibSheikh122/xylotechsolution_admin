name: Build Windows MSIX Installer, Android APK & iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows_installers:
    name: Build Windows (.msix & Setup Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Windows Platform & Font Assets
        shell: pwsh
        run: |
          flutter create --platforms=windows .
          New-Item -ItemType Directory -Force -Path "assets/fonts" | Out-Null
          if (-not (Test-Path "assets/fonts/BlackOpsOne-Regular.ttf")) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/blackopsone/BlackOpsOne-Regular.ttf" -OutFile "assets/fonts/BlackOpsOne-Regular.ttf"
          }

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release --no-tree-shake-icons

      - name: Generate Windows Setup Wizard (Next -> Next -> Install)
        shell: pwsh
        run: |
          $rel = (Get-ChildItem -Path "build\windows" -Recurse -Directory -Filter "Release" | Select-Object -First 1).FullName
          $lines = @(
            "[Setup]",
            "AppName=XyloTechSolution Admin",
            "AppVersion=1.0.0",
            "DefaultDirName={autopf}\XyloTechSolutionAdmin",
            "DefaultGroupName=XyloTechSolution Admin",
            "OutputDir=.",
            "OutputBaseFilename=XyloTechSolution_Admin_Setup",
            "Compression=lzma2",
            "SolidCompression=yes",
            "[Tasks]",
            "Name: `"desktopicon`"; Description: `"Create a desktop shortcut`"",
            "[Files]",
            "Source: `"$rel\*`"; DestDir: `"{app}`"; Flags: ignoreversion recursesubdirs createallsubdirs",
            "[Icons]",
            "Name: `"{group}\XyloTechSolution Admin`"; Filename: `"{app}\xylotechsolution_admin.exe`"",
            "Name: `"{autodesktop}\XyloTechSolution Admin`"; Filename: `"{app}\xylotechsolution_admin.exe`"; Tasks: desktopicon",
            "[Run]",
            "Filename: `"{app}\xylotechsolution_admin.exe`"; Description: `"Launch XyloTechSolution Admin`"; Flags: nowait postinstall skipifsilent"
          )
          $lines | Set-Content -Path "installer.iss" -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Generate Windows .msix Package (No-EXE Installer)
        continue-on-error: true
        shell: pwsh
        run: |
          flutter pub add --dev msix
          dart run msix:create --build-windows false --dont-install-cert

      - name: Upload Windows Full Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Full-Setup-Installer
          path: XyloTechSolution_Admin_Setup.exe

      - name: Upload Windows .msix App Package
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Windows-MSIX-App-Installer
          path: build/windows/**/*.msix

  build_android_apk:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Clean Android Gradle Wrapper & Inject INTERNET Permission
        run: |
          rm -rf android
          flutter create --platforms=android --org com.xylotechsolution .
          mkdir -p assets/fonts
          [ -f assets/fonts/BlackOpsOne-Regular.ttf ] || curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/blackopsone/BlackOpsOne-Regular.ttf" -o assets/fonts/BlackOpsOne-Regular.ttf
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application android:usesCleartextTraffic=\"true\"", 1)
          open(p, "w").write(s)
          '

      - name: Remove msix dev dependency on Linux before APK build
        run: |
          python3 -c '
          p = "pubspec.yaml"
          lines = [ln for ln in open(p).readlines() if "msix:" not in ln]
          open(p, "w").writelines(lines)
          '
          flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Installer
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios_ipa:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Font Asset Exists
        run: |
          mkdir -p assets/fonts
          [ -f assets/fonts/BlackOpsOne-Regular.ttf ] || curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/blackopsone/BlackOpsOne-Regular.ttf" -o assets/fonts/BlackOpsOne-Regular.ttf

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Unsigned iOS App
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package Runner.app into .ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r xylotechsolution_admin_ios.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Installer
          path: build/ios/ipa/xylotechsolution_admin_ios.ipa
